[package]
name = "openbuds"
version = "0.1.0"
description = "A modern cross-platform client for wireless earbuds"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "openbuds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
macaddr = "1"
thiserror = "2"
# Must match the versions openscq30-lib uses so the generic types unify.
indexmap = { version = "2", features = ["serde"] }
strum = "0.28"

# The reverse-engineered Soundcore protocol core. Pinned to a commit in production
# so upstream breaking changes (the crate is explicitly unstable) can't surprise you.
# Swap `branch = "master"` for `rev = "<commit>"` once you pick a known-good commit.
openscq30-lib = { git = "https://github.com/Oppzippy/OpenSCQ30", branch = "master" }

[features]
# this feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
