name: build

# Builds native installers on each platform:
#   - Windows: NSIS .exe installer + .msi
#   - Linux:   .AppImage + .deb
#
# Trigger manually (Actions tab -> Run workflow) to get downloadable artifacts,
# or push a tag like `v0.1.0` to publish a draft GitHub Release with the
# installers attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # AppImage + deb
          - platform: windows-latest # .exe (NSIS) + .msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux build dependencies for Tauri v2 + the bluer (D-Bus) Bluetooth backend.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential curl wget file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app + bundles
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a tag push: create a draft Release and upload the installers.
          # On a manual run: tagName is empty, so no release is made — the
          # installers are uploaded as workflow artifacts in the next step.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenBuds {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # For manual runs (no tag), expose the installers as downloadable artifacts.
      - name: Upload installers as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: openbuds-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
